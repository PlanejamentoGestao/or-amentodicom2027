<title>Orçamento DICOM 2026 x 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: deck de capítulos em tela cheia (identidade do painel de decisão DICOM), recolorido com os azuis FGV do orçamento */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F1F6F9; --line:#DCE5EB; --ink:#0D1E2A; --mut:#5B6B76;
  --acc:#008BC9; --acc-2:#006A9C; --acc-l:#7FBCDD; --mark:#CBE6F5; --acc-t:#E7F4FB;
  --deep:#05314A; --deep-2:#0B4566; --deep-ink:#FFFFFF; --deep-mut:#9DBFD3;
  --up:#006A9C; --down:#6B7A85; --shadow:0 10px 28px rgba(5,49,74,.09);
  color-scheme:light;
  --head:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
  --body:"Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
body.dk::before{background:var(--deep)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- moldura ---------- */
.prog{position:fixed;z-index:41;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--acc);transition:width .5s}
.top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;padding-block:calc(env(safe-area-inset-top,0px) + .9rem) .7rem;padding-left:max(16px,env(safe-area-inset-left,0px),2.2rem);padding-right:max(16px,env(safe-area-inset-right,0px),2.2rem);background:linear-gradient(180deg,var(--bg) 60%,transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:.8rem;font:600 .64rem var(--head);letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.brand::before{content:"";width:.6rem;height:.6rem;background:var(--acc)}
body.dk .top{background:linear-gradient(180deg,var(--deep) 60%,transparent)}
body.dk .brand{color:var(--deep-ink)}
.bot{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;align-items:center;gap:1rem;padding-block:.9rem calc(env(safe-area-inset-bottom,0px) + .9rem);padding-left:max(16px,env(safe-area-inset-left,0px),2.2rem);padding-right:max(16px,env(safe-area-inset-right,0px),2.2rem);background:linear-gradient(0deg,var(--bg) 62%,transparent)}
body.dk .bot{background:linear-gradient(0deg,var(--deep) 62%,transparent)}
.dots{display:flex;gap:.4rem;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:.5rem;height:.5rem;padding:0;border:1px solid var(--ink);background:transparent;transition:all .25s}
.dots button[aria-current="true"]{width:2rem;background:var(--acc);border-color:var(--acc)}
body.dk .dots button{border-color:var(--deep-mut)}
.pos{font:500 .68rem var(--head);letter-spacing:.2em;color:var(--mut);white-space:nowrap}
body.dk .pos{color:var(--deep-mut)}
.nv{height:2.6rem;padding:0 1.3rem;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 .64rem var(--head);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.nv.p{background:var(--ink);color:var(--bg)}
.nv:hover:not([disabled]){background:var(--acc);border-color:var(--acc);color:#fff}
.nv[disabled]{opacity:.3;cursor:not-allowed}
body.dk .nv{border-color:var(--deep-ink);color:var(--deep-ink)}
body.dk .nv.p{background:var(--deep-ink);color:var(--deep)}

/* ---------- slides ---------- */
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:calc(env(safe-area-inset-top,0px) + 4.4rem) calc(env(safe-area-inset-bottom,0px) + 6.5rem);padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);opacity:0;visibility:hidden;transform:translateX(3%);transition:opacity .45s,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s .5s}
.slide[data-s="before"]{transform:translateX(-3%)}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s}
.slide.dark{background:var(--deep);color:var(--deep-ink)}
.in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem}
.hd{display:flex;flex-direction:column;gap:1rem}
.kick{display:flex;align-items:center;gap:.9rem;font:600 .64rem var(--head);letter-spacing:.3em;text-transform:uppercase}
.kick i{display:block;width:2.6rem;height:3px;background:var(--acc)}
.kick em{font-style:normal;color:var(--mut);font-weight:500}
.kick em::before{content:"/";margin-right:.9rem;color:var(--line)}
h2{margin:0;font:300 clamp(1.7rem,3.6vw,2.9rem)/1.1 var(--head);letter-spacing:-.015em;text-wrap:balance}
h2 b{font-weight:700;padding:0 .1em;margin:0 -.1em;background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{margin:0;max-width:62rem;font-size:1.02rem;color:var(--mut);line-height:1.55}
.lead b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.lbl{font:700 .66rem var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.note{font-size:.84rem;color:var(--mut);margin:0}
.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.3rem;padding:0 1rem;border:1px solid var(--ink);background:transparent;font:600 .62rem var(--head);letter-spacing:.16em;text-transform:uppercase}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- capa ---------- */
.cov{--deep-ink:var(--ink);--deep-mut:var(--mut);--deep-2:var(--line);position:relative;display:flex;flex-direction:column;gap:2.6rem;padding-top:1.6rem;min-height:calc(100vh - 13rem);justify-content:center}
.cov-k{display:flex;align-items:center;gap:1rem;font:600 .7rem var(--head);letter-spacing:.32em;text-transform:uppercase;color:var(--acc)}
.cov-k::before{content:"";width:3.2rem;height:3px;background:var(--acc)}
.cov-h{margin:1.4rem 0 0;font:300 clamp(2.6rem,7vw,6rem)/.98 var(--head);letter-spacing:-.04em}
.cov-h b{font-weight:700;color:var(--acc)}
.cov-s{margin:1.6rem 0 0;font:300 clamp(1.05rem,1.8vw,1.5rem)/1.4 var(--head);color:var(--deep-mut);max-width:36rem}
.cov-s em{font-style:normal;color:var(--deep-ink);font-weight:500}
.cov-foot{display:flex;gap:3rem;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--deep-2);padding-top:1.3rem}
.cov-foot small{display:block;font:600 .55rem var(--head);letter-spacing:.28em;text-transform:uppercase;color:var(--deep-mut);margin-bottom:.45rem}
.cov-foot b{font:400 1rem var(--head)}
.cov-go{margin-left:auto;font:600 .62rem var(--head);letter-spacing:.28em;text-transform:uppercase;color:var(--acc);background:none;border:0}
.cov-ghost{position:absolute;right:0;bottom:4rem;font:700 clamp(7rem,20vw,17rem)/.8 var(--head);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px var(--mark);pointer-events:none;user-select:none}
.cov>*:not(.cov-ghost){position:relative;z-index:1}

/* ---------- visão geral ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;align-items:stretch}
.tot{--deep-ink:var(--ink);--deep-mut:var(--mut);--deep-2:var(--acc-l);background:var(--acc-t);color:var(--ink);padding:1.6rem 1.8rem;display:flex;flex-direction:column;gap:1.1rem;border-top:4px solid var(--acc)}
.tot .row{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.tot .y{font:600 .7rem var(--head);letter-spacing:.2em;color:var(--deep-mut);width:3rem}
.tot .v{font:300 clamp(2rem,4.6vw,3.4rem)/1 var(--head);letter-spacing:-.02em}
.tot .v small{font-size:.4em;font-weight:500;color:var(--deep-mut);margin-left:.3rem}
.tot .d{display:flex;gap:1.6rem;border-top:1px solid var(--deep-2);padding-top:1rem;flex-wrap:wrap}
.tot .d b{display:block;font:300 2rem/1 var(--head);color:var(--acc-2)}
.tot .d span{font-size:.82rem;color:var(--deep-mut)}
.tot p{margin:0;font-size:.82rem;color:var(--deep-mut);line-height:1.5}
.brg{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.brg h3{margin:0;font:600 1rem var(--head)}
.brow{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 6.2rem;gap:.8rem;align-items:center;background:none;border:0;padding:.35rem 0;text-align:left;width:100%}
.brow:hover .bn{color:var(--acc)}
.bn{font-weight:600;font-size:.92rem}
.bn small{display:block;font-weight:400;font-size:.76rem;color:var(--mut)}
.btrack{height:1.6rem;background:var(--soft);position:relative}
.btrack u{position:absolute;inset:0 auto 0 0;background:var(--acc);display:block;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bv{font-weight:700;text-align:right;white-space:nowrap}
.bv small{display:block;font-weight:500;font-size:.74rem;color:var(--mut)}
.bksgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.bk{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.45rem;text-align:left;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);border-top:3px solid var(--acc)}
.bk:hover{border-color:var(--acc)}
.bk b{font:600 .98rem var(--head)}
.bk .n{font:300 1.65rem/1.1 var(--head)}
.bk .n small{font-size:.5em;color:var(--mut);font-weight:500}
.bk p{margin:0;font-size:.82rem;color:var(--mut);line-height:1.4}
.bk em{font-style:normal;margin-top:auto;font:600 .6rem var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}


/* ---------- visão geral (pptx) ---------- */
.ovh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.ovc{display:flex;flex-direction:column;gap:.55rem;text-align:left;padding:1rem 1.2rem;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);box-shadow:var(--shadow)}
.ovc[aria-pressed="true"]{border-top-color:var(--acc);background:var(--acc-t)}
.ovc:hover{border-color:var(--acc)}
.ovn{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;font:300 clamp(1.5rem,3vw,2.3rem)/1 var(--head)}
.ovn small{display:block;font:600 .58rem var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:.35rem}
.ovn b{font-weight:500;color:var(--acc-2)}
.ovn i{font-style:normal;color:var(--acc);font-size:.8em}
.ovd{font-size:.9rem;color:var(--mut)}
.ovd b{color:var(--acc-2)}
.ovd em{font-style:normal;font-size:.8rem}
.ptw{overflow-x:auto}
.pt{min-width:560px;border-top:2px solid var(--ink)}
.ph,.pr{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,6.4rem) 7.4rem;gap:.8rem;align-items:center;padding:.6rem .9rem}
.ph{font:700 .6rem/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ph span:not(:first-child){text-align:right}
.ph span:nth-child(3){color:var(--acc-2)}
.pr{border-bottom:1px solid var(--line);font-size:.9rem}
.pr:nth-child(even){background:var(--soft)}
.pr .num{text-align:right;white-space:nowrap}
.pr .num.b{font-weight:700;color:var(--acc-2)}
.pr .dv small{display:block;font-size:.72rem;font-weight:500;color:var(--mut)}
.pr.ptot{background:var(--ink);color:var(--bg);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pr.ptot .num.b,.pr.ptot .dv,.pr.ptot .dv small{color:var(--bg)}
.pr.lv2>span:first-child{padding-left:1.4rem;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem}
.pch,.ppr{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
.pch svg{width:100%;height:auto;max-height:280px}
.pch text{font-family:var(--head)}
.ppr div{display:flex;flex-direction:column;gap:.15rem;padding-bottom:.6rem;border-bottom:1px dashed var(--line)}
.ppr div:last-child{border-bottom:0}
.ppr b{font-size:.95rem}
.ppr span{font-size:.86rem;color:var(--mut)}
.ppr span b{color:var(--acc-2);font-size:inherit}
.ppr small{font-size:.76rem;color:var(--acc-2)}
.pr.hl{background:var(--acc-t)!important;border-left:4px solid var(--acc);box-shadow:inset 0 0 0 1px var(--acc-l);font-weight:600}
.pr.hl .nb26{display:block;margin-top:.15rem;font:700 .64rem var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-2)}
.pr.hl .dv{color:var(--acc-2)}
@media (max-width:860px){.ovh,.pgrid{grid-template-columns:1fr}}
/* página 2: tudo na mesma tela, escalando com a altura da janela */
.slide:has(.fit){padding-block:calc(env(safe-area-inset-top,0px) + 3.4rem) calc(env(safe-area-inset-bottom,0px) + 4.6rem)}
.fit{gap:1em;font-size:clamp(13px,1.7vh,19px)}.fit .hd{gap:.5em}
.fit h2{font-size:2.2em}
.fit .lead{font-size:.98em;line-height:1.45}
.fit .ovh{gap:1.6em;margin-block:.7em .8em}.fit .ovc{padding:.75em 1em;gap:.35em}
.fit .ovn{font-size:2.1em}.fit .ovn small{font-size:.5em;margin-bottom:.2em}
.fit .ovd{font-size:.9em}
.fit .ph,.fit .pr{padding:.45em .9em;font-size:.98em;gap:.6em}
.fit .ph{font-size:.62em}
.fit .pt{min-width:0}
.mk{background:#FFF200;color:#0D1E2A;padding:.1em .4em;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fit .note{font-size:.85em}
@media (max-height:740px){.fit .lead{display:none}}
/* aviso de rolagem */
.sh{position:fixed;z-index:31;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4.3rem);transform:translateX(-50%);display:inline-flex;align-items:center;gap:.5rem;height:2.2rem;padding:0 1.1rem;border:1px solid var(--acc);background:var(--acc);color:#fff;font:600 .62rem var(--head);letter-spacing:.16em;text-transform:uppercase;box-shadow:0 8px 22px rgba(5,49,74,.28);animation:shb 1.6s ease-in-out infinite}
.sh:hover{background:var(--acc-2);border-color:var(--acc-2)}
@keyframes shb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}

/* ---------- como ler ---------- */
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.lg{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 1rem;background:var(--soft)}
.lg p{margin:0;font-size:.86rem;color:var(--mut)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.st3{padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.4rem}
.st3 .num{font:300 2.2rem/1 var(--head);color:var(--acc)}
.st3 b{font-size:1rem}
.st3 span{font-size:.88rem;color:var(--mut)}
.out{padding:.9rem 1.1rem;border:1px dashed var(--line);font-size:.88rem;color:var(--mut)}
.out b{color:var(--ink)}

/* ---------- pills ---------- */
.st{display:inline-flex;align-items:center;gap:.3rem;font:700 .6rem/1 var(--head);letter-spacing:.08em;text-transform:uppercase;padding:.32rem .5rem;white-space:nowrap;border:1px solid transparent}
.st.novo{background:var(--acc);color:#fff}
.st.saiu{background:transparent;color:var(--mut);border-color:var(--line);text-decoration:line-through}
.st.aum{background:var(--acc-t);color:var(--acc-2);border-color:var(--acc-l)}
.st.red{background:var(--soft);color:var(--down);border-color:var(--line)}
.st.igual{background:transparent;color:var(--mut);border-color:var(--line)}
.st.mudou{background:transparent;color:var(--acc-2);border:1px dashed var(--acc-l)}
.st.zero{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.st.renov{background:#E6F5EA;color:#1F6B3A;border-color:#BFE3CA}
.st.novot{background:var(--ink);color:var(--bg)}
.sup{display:inline-flex;align-items:center;gap:.35rem;font:600 .68rem/1.2 var(--body);color:var(--mut);padding:.18rem .45rem;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.sup i{width:.5rem;height:.5rem;border-radius:50%;background:var(--c,var(--acc));flex:none}
.inf{font-style:normal;color:var(--acc);font-weight:700;margin-left:.15rem}

/* ---------- tabela expansível ---------- */
.bhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.1rem;align-items:stretch}
.kpis{--deep-mut:var(--mut);--deep-2:var(--acc-l);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--acc-t);color:var(--ink);border-top:4px solid var(--acc)}
.kpi{padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.35rem}
.kpi+.kpi{border-left:1px solid var(--deep-2)}
.kpi span{font:600 .62rem var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--deep-mut)}
.kpi b{font:300 clamp(1.15rem,1.8vw,1.65rem)/1.05 var(--head);letter-spacing:-.02em;white-space:nowrap}
.kpi b.ac{color:var(--acc-2);font-weight:500}
.kpi small{font-size:.78rem;color:var(--deep-mut)}
.hl{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.55rem}
.hl ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.4rem;font-size:.9rem}
.hl li::marker{color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.chips .lbl{margin-right:.3rem}
.chip{height:2rem;padding:0 .75rem;border:1px solid var(--line);background:var(--card);font:600 .74rem var(--body);color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
.chip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--c,var(--acc))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.th,.gs,.ir,.tf{display:grid;grid-template-columns:minmax(0,1fr) 7.4rem 7.4rem 7.6rem 4.6rem;gap:.2rem 1rem;align-items:center}
.th{padding:.6rem .9rem;font:700 .62rem var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.th span:not(:first-child),.num{text-align:right;white-space:nowrap}
details.grp{border-bottom:1px solid var(--line);background:var(--card)}
details.grp:nth-of-type(even){background:var(--soft)}
details.grp[open]{background:var(--acc-t)}
.items .ir:nth-child(even){background:var(--card)}
.gs{list-style:none;cursor:pointer;padding:.8rem .9rem;position:relative}
.gs::-webkit-details-marker{display:none}
.gs:hover{background:var(--acc-t)}
.gn{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.gn b{font-weight:700;font-size:.98rem;display:flex;align-items:center;gap:.5rem}
.gn b::before{content:"+";flex:none;display:grid;place-items:center;width:1.3rem;height:1.3rem;border:1px solid var(--acc);color:var(--acc);font-weight:600;font-size:.95rem;line-height:1}
details[open]>.gs .gn b::before{content:"−";background:var(--acc);color:#fff}
.gn span{font-size:.8rem;color:var(--mut);padding-left:1.8rem}
.gn code{font:500 .68rem var(--body);color:var(--mut);opacity:.85}
.gs .num{font-weight:600}
.dv{font-weight:700}
.dv.up{color:var(--up)}
.dv.dn{color:var(--down)}
.pct{font-size:.82rem;color:var(--mut);text-align:right}
.items{padding:0 .9rem .7rem 2.7rem}
.ir{padding:.6rem 0;border-top:1px dashed var(--line)}
.ir:first-child{border-top:0}
.inm{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.inm b{font-weight:600;font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.inm p{margin:0;font-size:.8rem;color:var(--mut);line-height:1.4}
.inm p.ret{color:var(--ink)}
.inm p.ret::before{content:"Ganho esperado: ";font-weight:700;color:var(--acc-2)}
.inm p.mv{color:var(--acc-2);font-weight:600}
.trips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem 1rem;font-size:.78rem;color:var(--mut);margin-top:.15rem}
.trips div b{display:block;font:700 .6rem var(--head);letter-spacing:.14em;color:var(--ink);margin-bottom:.15rem}
.trips ul{margin:0;padding-left:1rem}
.ir .num{font-size:.88rem}

pal sair do ar.", "ret": "Continuidade. Troca de provedor sem parar a operação. O conjunto de alternativas custa 6% do bloco de APIs e protege os outros 94%.", "nov": "novo", "nat": "OPEX", "src": ["Grok API"]}, {"n": "APIs chinesas", "v26": 0.0, "v27": 21600.0, "sup": ["ia"], "note": "", "inf": false, "p": "Segunda reserva de contingência, a menor custo.", "ret": "Continuidade. Segunda alternativa, de menor custo, contra indisponibilidade ou reajuste do provedor principal.", "nov": "novo", "nat": "OPEX", "src": ["APIs chinesas"]}, {"n": "Claude Pro (desenvolvimento)", "v26": 0.0, "v27": 10800.0, "sup": ["ia"], "note": "", "inf": false, "p": "Versão para parte da equipe de desenvolvimento.", "ret": "Produtividade. Licença dimensionada por perfil de uso, para não pagar plano alto a quem não precisa.", "nov": "novo", "nat": "OPEX", "src": ["Claude Pro (desenvolvimento)"]}, {"n": "DeepSeek API", "v26": 0.0, "v27": 7200.0, "sup": ["ia"], "note": "", "inf": false, "p": "Custo muito baixo, para tarefas de menor criticidade.", "ret": "Eficiência. Absorve as tarefas de menor criticidade a custo marginal e derruba o custo médio por tarefa.", "nov": "novo", "nat": "OPEX", "src": ["DeepSeek API"]}, {"n": "Qwen API", "v26": 0.0, "v27": 7200.0, "sup": ["ia"], "note": "", "inf": false, "p": "Mesma lógica: custo baixo e alternativa aberta.", "ret": "Eficiência. Segundo fornecedor de baixo custo para rotina, mantém o preço sob concorrência.", "nov": "novo", "nat": "OPEX", "src": ["Qwen API"]}, {"n": "n8n", "v26": 0.0, "v27": 4000.0, "sup": ["ia"], "note": "", "inf": false, "p": "Plataforma para montar automações rapidamente, sem programar cada fluxo.", "ret": "Produtividade. Automação montada sem desenvolvimento do zero, ferramenta para o Núcleo de Automação Inteligente.", "nov": "novo", "nat": "OPEX", "src": ["n8n"], "prev": "Em 2026 estava na Coordenação SP (R$ 3,95 mil).", "mv": "Veio de outra área"}, {"n": "Traycer", "v26": 0.0, "v27": 2448.0, "sup": ["ia"], "note": "", "inf": false, "p": "Organiza planejamento e verificação do código em projetos grandes, como o DCC.", "ret": "Eficiência. Planejamento e revisão de código em projetos grandes como o DCC, reduz retrabalho e falha em produção.", "nov": "novo", "nat": "OPEX", "src": ["Traycer"]}, {"n": "Cursor", "v26": 0.0, "v27": 1953.0, "sup": ["ia"], "note": "", "inf": false, "p": "Editor de código com agentes de IA.", "ret": "Produtividade. Desenvolvimento diário assistido por agentes, encurta o ciclo de cada entrega.", "nov": "novo", "nat": "OPEX", "src": ["Cursor"], "prev": "Em 2026 estava na Coordenação SP (R$ 1,4 mil).", "mv": "Veio de outra área"}, {"n": "Kimi", "v26": 0.0, "v27": 900.0, "sup": ["ia"], "note": "", "inf": false, "p": "Assistente alternativo para ler documentos e códigos longos.", "ret": "Eficiência. Leitura de documentos e códigos longos a custo marginal, sem consumir modelo caro na tarefa.", "nov": "novo", "nat": "OPEX", "src": ["Kimi"]}, {"n": "Tactiq", "v26": 0.0, "v27": 797.0, "sup": ["ia"], "note": "", "inf": false, "p": "Transcreve reuniões em atas e tarefas.", "ret": "Produtividade. Reunião vira ata e tarefa automaticamente, com rastro de decisão e sem registro manual.", "nov": "novo", "nat": "OPEX", "src": ["Tactiq"]}]}, {"id": "t-gd", "name": "Governança de dados", "code": "Novo em 2027", "desc": "Organiza, protege e rastreia os dados que a IA e os painéis usam. Frente nova em 2027.", "items": [{"n": "Catálogo de dados (Knowledge Catalog)", "v26": 0.0, "v27": 24000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Inventário de cada base de dados, com responsável e classificação.", "ret": "Catalogar e controlar no GCP as bases de interesse (ex. SIGA, CACR e LYCEUM, etc, os dados de GA4 e Supermetrics) que alimentarão o Knowledge Graph FGV em nuvem. Para a LLM, o  Catalog define quais dados podem ser usados no treinamento da IA.", "nov": "novo", "nat": "OPEX", "src": ["Catálogo de dados (Knowledge Catalog)"]}, {"n": "Proteção de dados pessoais (Cloud DLP)", "v26": 0.0, "v27": 19200.0, "sup": ["gd"], "note": "", "inf": false, "p": "Identifica e protege dados sensíveis, em conformidade com a LGPD.", "ret": "Identifica e classifica dados pessoais e sensíveis nas bases de SIGA, CACR e LYCEUM, GA4 e Supermetrics, e etc... antes que cheguem ao Knowledge Graph FGV e à LLM, aplicando mascaramento, anonimização ou bloqueio conforme o nível de classificação. Dá cumprimento prático à Política de Governança de IA da FGV,", "nov": "novo", "nat": "OPEX", "src": ["Proteção de dados pessoais (Cloud DLP)"]}, {"n": "Registro e monitoramento", "v26": 0.0, "v27": 12000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Registra o uso e acompanha o desempenho da plataforma.", "ret": "Corresponde a três serviços de auditoria: 1) Cloud Logging: guarda os logs de cargas, consultas, acessos e erros. 2) Cloud Monitoring: acompanha desempenho e disponibilidade, com painéis e alertas de falha. 3) Cloud Audit Logs: registra quem acessou ou alterou cada dado e cada configuração, a trilha de auditoria.", "nov": "novo", "nat": "OPEX", "src": ["Registro e monitoramento"]}, {"n": "Claude Pro (arquitetura da informação)", "v26": 0.0, "v27": 10000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Licenças para a gerência de arquitetura e governança.", "ret": "Escalar o uso de dados de interesse da DICOM-FGV,  prospectar e testar cenários de expansão sob incerteza antes de decidir, selecionando os dados estrategicamente e priorizando arquiteturas eficientes, otimizadas seguras.", "nov": "novo", "nat": "OPEX", "src": ["Claude Pro (arquitetura da informação)"]}, {"n": "Rastreio da origem (Data Lineage)", "v26": 0.0, "v27": 7200.0, "sup": ["gd"], "note": "", "inf": false, "p": "Mostra de onde vem cada dado e por onde passou.", "ret": "Permite saber quais fontes sustentaram cada resposta ou insight no DCC, auditar o uso de dados no treinamento e na consulta e bloquear com precisão uma fonte suspensa ou sem base legal. ", "nov": "novo", "nat": "OPEX", "src": ["Rastreio da origem (Data Lineage)"]}, {"n": "Armazenamento e backup (Data Lake)", "v26": 0.0, "v27": 6000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Guarda os dados em camadas: brutos, tratados e confiáveis.", "ret": "Criação de um ambiente de dados em nuvem, em camadas (brutos, tratados e confiáveis, classificados em nível 1 a 4), com alta disponibilidade em nuvem. Será integrada ao FGV Datalake da DTI, e prevê integração via API e também consumo de bases de dados externas. Em 2027, iniciará com as bases do v1.0 (GA4, funil oficial, mídia paga, Market Cloud, SEMrush e GeoCapes), permite criar datasets intermediários reutilizáveis e deixar a estrutura pronta para integrar as próximas bases. ", "nov": "novo", "nat": "OPEX", "src": ["Armazenamento e backup (Data Lake)"]}, {"n": "Chaves de criptografia (Cloud KMS)", "v26": 0.0, "v27": 6000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Guarda as chaves que protegem os dados.", "ret": "Guarda as chaves de criptografia das bases de Nível 3 e dos resultados consolidados do DCC e prevê o uso para dados de Nível 4, ultraconfidenciais conforme a NP TI.03.001.2024. Nenhuma fonte do v1.0 está hoje nesse nível. A previsão é desenvolver e testar uma arquitetura sigilosa de referência, com chaves de gestão restrita, acesso mínimo e trilha de auditoria, que sirva de modelo para projetos futuros. O uso de dados de Nível 4 depende de autorização da Presidência.", "nov": "novo", "nat": "OPEX", "src": ["Chaves de criptografia (Cloud KMS)"]}, {"n": "Claude Premium (governança de dados)", "v26": 0.0, "v27": 6000.0, "sup": ["gd"], "note": "", "inf": false, "p": "Apoia modelagem, documentação e análise de metadados.", "ret": "Acelera a modelagem, a documentação e a análise de metadados das bases do DCC (dados históricos, não estruturados, externos, GA4 e Supermetrics e outros). Como a maioria dos dados da FGV não tem metadados identificados, o uso de IA é essencial para levantar, descrever e padronizar campos, relações e significados em escala, o que seria inviável apenas de forma manual.", "nov": "novo", "nat": "OPEX", "src": ["Claude Premium (governança de dados)"]}, {"n": "Segurança e rede", "v26": 0.0, "v27": 4800.0, "sup": ["gd"], "note": "", "inf": false, "p": "Conexão segura entre os ambientes.", "ret": "Para o DCC, cria um túnel criptografado com alta disponibilidade, o investimento prevê o conjunto inicial é o Cloud VPN (HA VPN), o Secret Manager, que protege as credenciais de API, e o VPC Service Controls, que cria um perímetro de proteção e libera o acesso por perfil conforme o nível de classificação e para toda entrada de dados externos, por API ou web scraping (notícias e mídia)", "nov": "novo", "nat": "OPEX", "src": ["Segurança e rede"]}]}, {"id": "t-crm", "name": "CRM e relacionamento com candidatos (Salesforce)", "code": "Renovação", "desc": "Sistema onde ficam os contatos dos candidatos e de onde saem e-mails, SMS e WhatsApp automáticos, mais o cadastro único de contatos.", "items": [{"n": "WhatsApp no Marketing Cloud", "v26": 239000.0, "v27": 511200.0, "sup": ["ir"], "note": "Item que mais cresce no CRM.", "inf": false, "p": "Permite enviar mensagens ativas por WhatsApp pelo Salesforce; é o item que mais cresceu (+R$ 272 mil).", "ret": "", "nov": "renov", "nat": "OPEX", "src": ["WhatsApp no Marketing Cloud"]}, {"n": "Marketing Cloud", "v26": 406000.0, "v27": 434400.0, "sup": ["ir"], "note": "", "inf": false, "p": "Módulo que envia e-mails, SMS e jornadas automáticas aos candidatos.", "ret": "", "nov": "renov", "nat": "OPEX", "src": ["Marketing Cloud"]}, {"n": "Licenciamento por contatos (1,8 milhão, 3 anos)", "v26": 270000.0, "v27": 288900.0, "sup": ["ir"], "note": "", "inf": false, "p": "Direito de manter 1,8 milhão de contatos na plataforma.", "ret": "", "nov": "renov", "nat": "OPEX", "src": ["Licenciamento por contatos (1,8 milhão, 3 anos)"]}, {"n": "Suporte Selbetti", "v26": 174005.8, "v27": 185981.0, "sup": ["ir"], "note": "", "inf": false, "n26": "Suporte MD2 (cadastro function brl(v){const a=Math.abs(v);if(a<0.5)return 'R$ 0';if(a>=1e6)return 'R$ '+nf(a/1e6,2)+' mi';if(a>=1e3)return 'R$ '+nf(a/1e3,1)+' mil';return 'R$ '+nf(a,0);}
function sbrl(v){if(Math.abs(v)<0.5)return 'R$ 0';return (v>0?'+':'−')+brl(v);}
const exact=v=>'R$ '+nf(v,2);
function pct(a,b){if(a===0&&b===0)return '—';if(a===0)return 'novo';if(b===0)return '−100%';const p=(b-a)/a*100;return (p>0?'+':'−')+nf(Math.abs(p),Math.abs(p)<10?1:0)+'%';}

function status(x){
  const a=x.v26,b=x.v27;
  if(a===0&&b===0)return['zero','Sem valor'];
  if(x.mv)return['mudou',a>0?'Mudou de lugar':'Veio de outra área'];
  if(a===0)return['novo','Novo'];
  if(b===0)return['saiu','Saiu'];
  if(Math.abs(b-a)<1)return['igual','Igual'];
  return b>a?['aum','Aumentou']:['red','Reduziu'];
}

function tableHTML(bid,flt){

  const gs=b.groups.map(g=>{const all=g.items.filter(x=>!flt||x.sup.includes(flt));return{g,all,its:all.filter(x=>x.v27>0),a:all.reduce((s,x)=>s+x.v26,0),c:all.reduce((s,x)=>s+x.v27,0)};}).filter(o=>o.all.length);
  gs.sort((p,q)=>(q.g.id==='t-adj')-(p.g.id==='t-adj')||Math.max(q.a,q.c)-Math.max(p.a,p.c));
  gs.forEach(o=>{
    t26+=o.a;t27+=o.c;if(!o.its.length)return;const d=o.c-o.a;
    const its=o.its.slice().sort((p,q)=>Math.max(q.v26,q.v27)-Math.max(p.v26,p.v27));

<div class="items">${its.map(x=>itemRow(x)).join('')}</div></details>`;
  });

}
function itemRow(x){
  const d=x.v27-x.v26,s=status(x);

  if(x.n26&&x.v26>0)extra+=`<p>Em 2026: ${esc(x.n26)}.</p>`;
  if(x.p)extra+=`<p>${esc(x.p)}</p>`;
  if(x.ret)extra+=`<p class="ret">${esc(x.ret)}</p>`;
  if(x.note)extra+=`<p>${esc(x.note)}</p>`;
  if(x.prev)extra+=`<p class="mv">${esc(x.prev)}</p>`;
  if(x.mv&&!x.prev)extra+=`<p class="mv">${esc(x.mv)}.</p>`;

<span class="num" data-l="2026" title="${exact(x.v26)}">${brl(x.v26)}</span><span class="num" data-l="2027" title="${exact(x.v27)}">${brl(x.v27)}</span><span class="num dv ${d>0?'up':d<0?'dn':''}" data-l="Variação">${sbrl(d)}</span><span class="pct stc">${pct(x.v26,x.v27)}</span></div>`;
}

function supAgg(f){
  const m={};
  ALL.forEach(x=>{if(f&&x.blk!==f)return;const k=x.sup[0];m[k]=m[k]||{a:0,b:0,n:0};m[k].a+=x.v26;m[k].b+=x.v27-(!f&&x.dup27?x.dup27:0);m[k].n++;});
  return Object.keys(m).map(k=>Object.assign({k},m[k])).sort((p,q)=>q.b-p.b||q.a-p.a);
}
function supHTML(f){
  const rows=supAgg(f),mx=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
  return rows.map(r=>{const d=r.b-r.a;return `<button class="srow" type="button" data-sup="${r.k}" data-f="${f}"><span class="sn" style="--c:${SUPC[r.k]}"><i></i>${esc(SUP[r.k])}</span><span class="bars"><span class="bar a"><u style="width:${(r.a/mx*82).toFixed(2)}%"></u>${brl(r.a)}</span><span class="bar b"><u style="width:${(r.b/mx*82).toFixed(2)}%"></u>${brl(r.b)}</span></span><span class="dv ${d>0?'up':d<0?'dn':''}">${sbrl(d)}</span></button>`;}).join('');
}

   ORDER.forEach(b=>{const l=its.filter(x=>x.blk===b);if(!l.length)return;h+=`<h4>${esc(BL[b].name)}</h4><div class="items" style="padding:0">${l.sort((p,q)=>Math.max(q.v26,q.v27)-Math.max(p.v26,p.v27)).map(itemRow).join('')}</div>`;});
   openModal(SUP[k],h);
  });
 }});

/* tecnologia */
function ticChart(){
  const b=BL.tic,nvs=ALL.filter(x=>x.blk==='tic'&&x.nov==='novo'),novIA=nvs.filter(x=>gid(x)==='t-ia').reduce((s,x)=>s+x.v27,0),novGD=nvs.filter(x=>gid(x)==='t-gd').reduce((s,x)=>s+x.v27,0);
  const novOut=nvs.filter(x=>!['t-ia','t-gd'].includes(gid(x))).reduce((s,x)=>s+x.v27,0);
  const ren=b.t27-novIA-novGD-novOut;
  const H=230,mx=b.t27,sc=v=>v/mx*H,y0=262,bw=150,x1=60,x2=290;
  const h26=sc(b.t26),hr=sc(ren),hn=sc(novIA+novGD+novOut);
  return {ren,novIA,novGD,novOut,svg:`<svg viewBox="0 0 520 310" role="img" aria-label="Tecnologia: 2026 ${brl(b.t26)}; 2027 ${brl(ren)} de renovações mais ${brl(novIA+novGD+novOut)} de itens novos">
<line x1="${x1}" x2="${x2+bw}" y1="${y0-h26}" y2="${y0-h26}" stroke="var(--mut)" stroke-dasharray="4 5" stroke-width="1.2"/>
<rect x="${x1}" y="${y0-h26}" width="${bw}" height="${h26}" fill="var(--acc-l)" opacity=".55"/>
<text x="${x1+bw/2}" y="${y0-h26/2+6}" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)">${brl(b.t26)}</text>
<rect x="${x2}" y="${y0-hr}" width="${bw}" height="${hr}" fill="var(--deep)"/>
<text x="${x2+bw/2}" y="${y0-hr/2}" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">${brl(ren)}</text>
<text x="${x2+bw/2}" y="${y0-hr/2+19}" text-anchor="middle" font-size="12" fill="#cfe3ee">renovações</text>
<rect x="${x2}" y="${y0-hr-hn}" width="${bw}" height="${hn}" fill="var(--acc)"/>
<text x="${x2+bw/2}" y="${y0-hr-hn/2}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">+ ${brl(novIA+novGD+novOut)}</text>
<text x="${x2+bw/2}" y="${y0-hr-hn/2+18}" text-anchor="middle" font-size="12" fill="#fff">itens novos</text>
<text x="${x2+bw+10}" y="${y0-hr-hn+6}" font-size="13" font-weight="700" fill="var(--ink)">${brl(b.t27)}</text>
<line x1="${x1-12}" x2="${x2+bw+12}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="1.5"/>
<text x="${x1+bw/2}" y="${y0+24}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">2026</text>
<text x="${x2+bw/2}" y="${y0+24}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">2027</text>
<text x="${x1+bw/2}" y="${y0+41}" text-anchor="middle" font-size="11" fill="var(--mut)">valor de referência</text></svg>`};
}
function gid(x){for(const g of BL.tic.groups)if(g.items.includes(x))return g.id;return '';}

<div class="rv">${blockTools('tic')}</div></div>`;},init:wireBlock});

/* entrou e saiu */
const MVT=[['novo','O que entra',x=>x.v26===0&&x.v27>0&&!x.mv&&x.kind!=='reserva',x=>x.v27],['aum','Maiores aumentos',x=>x.v26>0&&x.v27>x.v26+1&&x.kind!=='reserva',x=>x.v27-x.v26],['red','Maiores reduções',x=>x.v27>0&&x.v26>x.v27+1,x=>x.v26-x.v27]];
function mvHTML(k){const m=MVT.find(z=>z[0]===k),l=ALL.filter(m[2]).sort((p,q)=>m[3](q)-m[3](p)),top=l.slice(0,10),tot=l.reduce((s,x)=>s+m[3](x),0);
 return `<p class="note">${l.length} itens somam ${brl(tot)}${l.length>10?'. Abaixo, os 10 maiores':''}.</p><div class="mvl">${top.map((x,i)=>{const v=m[3](x);return `<div class="mvr"><span class="rk">${i+1}</span><div><b>${esc(x.n)}</b><p>${esc(BL[x.blk].short)} · ${esc(x.grp)} · ${esc(SUPS_SHORT[x.sup[0]])}${x.inf?' ≈':''}</p></div>${stPill(x)}<span class="num">${k==='saiu'||k==='red'?'−':'+'}${brl(v)}</span></div>`;}).join('')}</div>`;}
SL.push({t:'Entradas e saídas',html:()=>`<div class="in"><div class="hd">${kick(4,'Entradas e saídas')}<h2 class="rv">O que <b>entra</b>, o que <b>sai</b> e o que muda de tamanho</h2></div>
<p class="lead rv">Os itens de todos os orçamentos, juntos. Itens sem valor em 2027 não são listados. As reservas para softwares não entram na lista de novos.</p>
<div class="chips rv" id="mvF">${MVT.map((m,i)=>`<button class="chip" type="button" data-v="${m[0]}" aria-pressed="${i===0}">${m[1]}</button>`).join('')}</div>
<div class="card rv" style="padding:.8rem 1.1rem" id="mvB">${mvHTML('novo')}</div></div>`,
 init(el){el.addEventListener('click',e=>{const c=e.target.closest('#mvF .chip');if(!c)return;$$('#mvF .chip',el).forEach(x=>x.setAttribute('aria-pressed',x===c));$('#mvB',el).innerHTML=mvHTML(c.dataset.v);});}});

/* notas */
SL.push({t:'Notas e fontes',html:()=>{return `<div class="in"><div class="hd">${kick(9,'Notas e fontes')}<h2 class="rv">Como os números <b>foram montados</b></h2></div>
<div class="notes rv">
<section class="card nb"><h3>Fontes</h3><ul>
<li><b>Institucional, Coordenação RJ e SP:</b> abas “Institucional” e “RJ e SP” do v1 2026 e do v1 2027 (coluna de total anual). Viagens detalhadas pela aba “Rateio Diárias”.</li>
<li><b>Tecnologia 2027:</b> Slide 7 de Tecnologia, versão completa (R$ 5.005 mil). Descrições e ganhos esperados de IA e governança de dados: versão revisada por Inovação e IA e Governança de Dados.</li>
<li><b>Tecnologia 2026:</b> valor de referência de R$ 3.088 mil. O Consolidado TIC v2 2026 detalha R$ 2.662 mil; a diferença (${brl(D.TIC26_REF-D.TIC26_DET)}) aparece em uma linha própria.</li>
<li><b>Superintendências:</b> planilha de aprovados e reprovados do Facó, Planilhão de Contratos e Ferramentas e aba “Ferramentas Cartão” do v1 2027.</li></ul></section>
<section class="card nb"><h3>Regras adotadas</h3><ul>
<li><b>Mestrado Unificado:</b> R$ 6,82 mi em 2027. Os R$ 321,5 mil previstos para o Contact Center (Resposta audível) voltaram para a campanha; essa conta fica zerada. O total do Institucional não muda.</li>
<li><b>Ferramentas em dois lugares:</b> ${brl(DUPT)} em ferramentas foram orçados na Coordenação RJ (${brl(D.DUP.rj)}), na Coordenação SP (${brl(D.DUP.sp)}) e no Institucional (${brl(D.DUP.inst)}) e também na Tecnologia. Nessas abas, elas aparecem como “Reserva para softwares”; os nomes aparecem só em Tecnologia.</li>
<li><b>Comparação das reservas:</b> o valor de 2026 de cada reserva é a soma das ferramentas equivalentes, que em 2026 eram listadas uma a uma.</li>
<li><b>Mesmo item:</b> descrições que só mudaram o ano ou a edição (por exemplo, “8º Seminário” e “9º Seminário”) foram tratadas como o mesmo item. Linhas sem valor nos dois anos foram omitidas.</li></ul></section>

</div></div>`;}});

/* recorte: slides 1, 2, 8 e 9 */
{const keep=[0,1,7];const k=keep.map(i=>SL[i]);SL.length=0;k.forEach(x=>SL.push(x));}
/* ---------- montagem ---------- */
const stage=$('#stage');
SL.forEach((s,i)=>{const e=document.createElement('section');e.className='slide'+(s.dark?' dark':'');e.dataset.s='after';e.setAttribute('aria-label',(i+1)+'. '+s.t);e.innerHTML=s.html();$$('.rv',e).forEach((r,k)=>r.style.setProperty('--i',k));stage.appendChild(e);s.el=e;if(s.init)s.init(e);});
$('#dots').innerHTML=SL.map((s,i)=>`<button type="button" data-i="${i}" aria-label="${i+1}. ${esc(s.t)}" title="${esc(s.t)}"></button>`).join('');

const modal=document.createElement('div');modal.className='modal';modal.hidden=true;
modal.innerHTML='<div class="mbk" data-close></div><div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mhd"><h3 id="mt"></h3><button class="mx" type="button" data-close aria-label="Fechar">✕</button></div><div class="mbd"></div></div>';
document.body.appendChild(modal);
let lastF=null;
function openModal(t,h){lastF=document.activeElement;$('#mt',modal).textContent=t;const b=$('.mbd',modal);b.innerHTML=h;b.scrollTop=0;modal.hidden=false;$('.mx',modal).focus();}
function closeModal(){modal.hidden=true;if(lastF&&lastF.focus)lastF.focus();}
modal.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal();});

let cur=-1;
const sh=$('#sh');
function chkScroll(){const e=cur>=0&&SL[cur]&&SL[cur].el;if(!e){sh.hidden=true;return;}const rest=e.scrollHeight-e.clientHeight-e.scrollTop;sh.hidden=!(e.scrollHeight-e.clientHeight>24&&rest>24);}
sh.onclick=()=>{const e=SL[cur].el;e.scrollBy({top:Math.round(e.clientHeight*.7),behavior:'smooth'});};
SL.forEach(x=>x.el.addEventListener('scroll',chkScroll,{passive:true}));
window.addEventListener('resize',chkScroll);
stage.addEventListener('click',()=>setTimeout(chkScroll,80));
function go(i){if(i<0||i>=SL.length||i===cur)return;cur=i;
 SL.forEach((s,k)=>{s.el.classList.toggle('on',k===i);s.el.dataset.s=k<i?'before':'after';if(k===i)s.el.removeAttribute('aria-hidden');else s.el.setAttribute('aria-hidden','true');});
 document.body.classList.toggle('dk',!!SL[i].dark);SL[i].el.scrollTop=0;
 $$('.rv',SL[i].el).forEach(r=>{r.style.animation='none';void r.offsetWidth;r.style.animation='';});
 if(SL[i].enter)SL[i].enter(SL[i].el);
 $('#pos').textContent=(i+1)+' de '+SL.length;$('#prog').style.width=((i+1)/SL.length*100)+'%';
 $$('#dots button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
 $('#bPrev').disabled=i===0;$('#bNext').disabled=i===SL.length-1;
 try{history.replaceState(null,'','#'+(i+1));}catch(e){}
 sh.hidden=true;setTimeout(chkScroll,700);
}
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
$('#dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i);};
stage.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go);});
document.addEventListener('keydown',e=>{
 if(!modal.hidden){if(e.key==='Escape')closeModal();return;}
 if(e.altKey||e.ctrlKey||e.metaKey)return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
 if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>110&&!e.target.closest('.tbl,.chips'))go(cur+(dx<0?1:-1));},{passive:true});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n)go(n-1);});
go(Math.min(SL.length-1,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1)));
})();
